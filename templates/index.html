<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recordatorios de Salud - Facu Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .reminders-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .reminder-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px;
            color: white;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .reminder-card.water {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .reminder-card.break {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .reminder-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .reminder-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .reminder-card h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .reminder-count {
            font-size: 2.5em;
            font-weight: bold;
            margin: 15px 0;
        }

        .reminder-time {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-trigger {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-trigger:hover {
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        .btn-trigger:active {
            transform: translateY(0);
        }

        .config-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .config-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .config-item {
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            align-items: center;
        }

        .config-item label {
            color: #666;
            font-weight: 500;
        }

        .config-item input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .config-item input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-secondary {
            background: #E0E0E0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .status-message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #4facfe;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #0066cc;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .reminders-grid {
                grid-template-columns: 1fr;
            }

            .config-item {
                grid-template-columns: 1fr;
            }
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💪 Recordatorios de Salud</h1>
            <p>Mantén tu bienestar durante el día</p>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div class="reminders-grid">
            <div class="reminder-card water">
                <div class="reminder-icon">💧</div>
                <h2>Agua</h2>
                <div class="reminder-count" id="waterCount">0</div>
                <div class="reminder-time" id="waterTime">Nunca</div>
                <button class="btn-trigger" onclick="triggerReminder('water')">
                    Recordar Ahora
                </button>
            </div>

            <div class="reminder-card break">
                <div class="reminder-icon">🚶</div>
                <h2>Descanso</h2>
                <div class="reminder-count" id="breakCount">0</div>
                <div class="reminder-time" id="breakTime">Nunca</div>
                <button class="btn-trigger" onclick="triggerReminder('break')">
                    Recordar Ahora
                </button>
            </div>
        </div>

        <div class="config-section">
            <h3>⚙️ Configuración</h3>
            
            <div class="config-item">
                <label for="waterInterval">Intervalo de Agua (minutos):</label>
                <input type="number" id="waterInterval" value="30" min="5" max="180">
            </div>

            <div class="config-item">
                <label for="breakInterval">Intervalo de Descanso (minutos):</label>
                <input type="number" id="breakInterval" value="60" min="5" max="180">
            </div>

            <div class="button-row">
                <button class="btn-trigger" onclick="updateIntervals()">
                    Guardar Configuración
                </button>
                <button class="btn-secondary" onclick="resetCounters()">
                    Reiniciar Contadores
                </button>
            </div>
        </div>

        <div class="info-box">
            <strong>💡 Tip:</strong> Los recordatorios se dispararán automáticamente según los intervalos configurados. 
            También puedes dispararlos manualmente en cualquier momento.
        </div>
    </div>

    <script>
        const API_PREFIX = '{{ prefix }}/api';
        let updateInterval;

        async function fetchReminders() {
            try {
                const response = await fetch(`${API_PREFIX}/reminders`);
                const data = await response.json();
                
                document.getElementById('waterCount').textContent = data.water.count;
                document.getElementById('breakCount').textContent = data.break.count;
                
                document.getElementById('waterTime').textContent = 
                    data.water.last_reminder ? new Date(data.water.last_reminder).toLocaleTimeString('es-ES') : 'Nunca';
                document.getElementById('breakTime').textContent = 
                    data.break.last_reminder ? new Date(data.break.last_reminder).toLocaleTimeString('es-ES') : 'Nunca';
                
                document.getElementById('waterInterval').value = data.water.interval;
                document.getElementById('breakInterval').value = data.break.interval;
            } catch (error) {
                console.error('Error al obtener recordatorios:', error);
            }
        }

        async function triggerReminder(type) {
            try {
                const url = type === 'water' 
                    ? `${API_PREFIX}/reminders/water`
                    : `${API_PREFIX}/reminders/break`;
                
                const response = await fetch(url, { method: 'POST' });
                const data = await response.json();
                
                showMessage(data.message, 'success');
                fetchReminders();
            } catch (error) {
                console.error('Error al disparar recordatorio:', error);
                showMessage('Error al disparar el recordatorio', 'error');
            }
        }

        async function updateIntervals() {
            try {
                const waterInterval = parseInt(document.getElementById('waterInterval').value);
                const breakInterval = parseInt(document.getElementById('breakInterval').value);
                
                if (waterInterval < 5 || breakInterval < 5) {
                    showMessage('Los intervalos deben ser al menos 5 minutos', 'error');
                    return;
                }
                
                const response = await fetch(`${API_PREFIX}/config/intervals`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        water_interval: waterInterval,
                        break_interval: breakInterval
                    })
                });
                
                const data = await response.json();
                showMessage('✅ Configuración guardada exitosamente', 'success');
                fetchReminders();
            } catch (error) {
                console.error('Error al actualizar configuración:', error);
                showMessage('Error al guardar la configuración', 'error');
            }
        }

        async function resetCounters() {
            try {
                const response = await fetch(`${API_PREFIX}/reminders/reset`, { method: 'POST' });
                const data = await response.json();
                showMessage('✅ Contadores reiniciados', 'success');
                fetchReminders();
            } catch (error) {
                console.error('Error al reiniciar contadores:', error);
                showMessage('Error al reiniciar contadores', 'error');
            }
        }

        function showMessage(message, type) {
            const element = document.getElementById('statusMessage');
            element.textContent = message;
            element.className = `status-message ${type}`;
            
            setTimeout(() => {
                element.className = 'status-message';
            }, 3000);
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            fetchReminders();
            updateInterval = setInterval(fetchReminders, 5000); // Actualizar cada 5 segundos
        });

        // Limpiar al descargar
        window.addEventListener('beforeunload', () => {
            if (updateInterval) clearInterval(updateInterval);
        });
    </script>
</body>
</html>
